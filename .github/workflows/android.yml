name: Build Android
on:
  workflow_dispatch:
    inputs:
      test_build:
        description: "Test build: installs next to the normal app instead of updating it"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Empty values fall back to the normal app ID and name (see capacitor.config.ts).
      CAP_APP_ID: ${{ inputs.test_build && 'app.lovable.skyrim_plugin_workshop.twa.test' || '' }}
      CAP_APP_NAME: ${{ inputs.test_build && 'ESP Editor TEST' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install
        run: bun install

      - name: Build static web app
        run: bun run build:android

      - name: Locate built index.html
        run: |
          IDX=$(find dist .output -name index.html -not -path "*/node_modules/*" 2>/dev/null | head -1)
          if [ -z "$IDX" ]; then echo "No index.html produced. Build output:"; find dist .output -maxdepth 3 | head -50; exit 1; fi
          echo "CAP_WEB_DIR=$(dirname "$IDX")" >> "$GITHUB_ENV"
          echo "Using $(dirname "$IDX")"

      - name: Create Android project
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          [ -d android ] || npx cap add android
          # Open-with filters and the native plugin (open-with + save-folder picker)
          node scripts/patch-android.mjs
          # Launcher icon from the app's own maskable icon
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26 $RES/drawable-v24/ic_launcher_foreground.xml
          # Adaptive icon (Android 8+): the launcher masks it to its own shape. The background is the icon's flat
          # colour; the foreground is the icon at 72% on a transparent 108dp canvas, so the logo stays in the safe zone.
          BG="#152846"
          mkdir -p $RES/mipmap-anydpi-v26 $RES/values
          cat > $RES/values/esp_icon_colors.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <resources><color name="esp_icon_bg">$BG</color></resources>
          XML
          for f in ic_launcher ic_launcher_round; do
            cat > $RES/mipmap-anydpi-v26/$f.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/esp_icon_bg"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          for d in mdpi:108 hdpi:162 xhdpi:216 xxhdpi:324 xxxhdpi:432; do
            C=${d#*:}; I=$((C * 72 / 100)); M=$RES/mipmap-${d%:*}; mkdir -p $M
            convert public/icons/icon-maskable-512.png -resize ${I}x${I} -background none -gravity center -extent ${C}x${C} $M/ic_launcher_foreground.png
          done
          # Rounded legacy icons for Android 7 and older
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            S=${d#*:}; M=$RES/mipmap-${d%:*}; mkdir -p $M
            R=$((S * 22 / 100))
            convert public/icons/icon-maskable-512.png -resize ${S}x${S} \
              \( -size ${S}x${S} xc:none -fill white -draw "roundrectangle 0,0,$((S-1)),$((S-1)),$R,$R" \) \
              -compose DstIn -composite $M/ic_launcher.png
            convert public/icons/icon-maskable-512.png -resize ${S}x${S} \
              \( -size ${S}x${S} xc:none -fill white -draw "roundrectangle 0,0,$((S-1)),$((S-1)),$((S/2)),$((S/2))" \) \
              -compose DstIn -composite $M/ic_launcher_round.png
          done
          npx cap sync android
          # Must be higher than the old TWA release on Play
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}0/" android/app/build.gradle

      - name: Build release (unsigned)
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KS_B64" | base64 -d > signing.keystore
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs
          mkdir -p dist-out
          $BT/zipalign -p 4 $OUT/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks signing.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out dist-out/ESP-Editor${{ inputs.test_build && '-test' || '' }}.apk aligned.apk
          jarsigner -keystore signing.keystore -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -signedjar dist-out/ESP-Editor${{ inputs.test_build && '-test' || '' }}.aab $OUT/bundle/release/app-release.aab "$KS_ALIAS"
          rm signing.keystore

      - uses: actions/upload-artifact@v4
        with:
          name: ESP-Editor-android${{ inputs.test_build && '-test' || '' }}
          path: dist-out/
