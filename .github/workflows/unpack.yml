   name: Unpack upload
   on: workflow_dispatch
   permissions:
     contents: write
   jobs:
     unpack:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4
         - run: |
             unzip -q skyrim-plugin-workshop-android.zip -d _tmp
             rm -rf _tmp/skyrim-plugin-workshop-main/.github
             cp -a _tmp/skyrim-plugin-workshop-main/. .
             rm -rf _tmp skyrim-plugin-workshop-android.zip
         - run: |
             git config user.name "github-actions"
             git config user.email "actions@github.com"
             git add -A
             git commit -m "Add Android wrapper and extract-to-esp feature"
             git push
